[package]
name = "yeti"
version = "0.2.0"
edition = "2021"

[dependencies]
# CLI & Logging
clap = { version = "4.5", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
colored = "2.1"

# Forensic Performance & DB
rayon = "1.10"
memmap2 = "0.9"
rusqlite = { version = "0.31", features = ["bundled"] }

# Filesystem & Compression
backhand = "0.14"
crc32fast = "1.4"

# User Interface
ratatui = "0.26"
crossterm = { version = "0.28.1", features = ["events"] }

# Cryptography & Analysis
sha2 = "0.10"
sha-1 = "0.10"
md-5 = "0.10"
hex = "0.4"

# Networking & Serialization (Crucial Additions)
tokio = { version = "1.37", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Math & Utility
num-traits = "0.2"